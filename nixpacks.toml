@"
[phases.setup]
nixPkgs = ["php82", "php82Extensions.bcmath", "php82Extensions.gd", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.sodium", "php82Extensions.pcntl", "php82Extensions.zip", "php82Extensions.mbstring", "php82Extensions.curl", "php82Extensions.fileinfo", "php82Extensions.dom", "php82Extensions.xml", "php82Extensions.tokenizer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = ["php artisan config:cache", "php artisan route:cache"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=`$PORT"
"@ | Out-File -FilePath nixpacks.toml -Encoding UTF8 -NoNewline