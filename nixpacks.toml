@"
[phases.setup]
nixPkgs = ['php82', 'php82Extensions.bcmath', 'php82Extensions.gd', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.sodium', 'php82Extensions.pcntl', 'php82Extensions.zip', 'php82Extensions.mbstring']

[phases.install]
cmds = ['composer install --optimize-autoloader --no-scripts --no-interaction']

[phases.build]
cmds = [
    'php artisan config:cache',
    'php artisan route:cache',
    'php artisan view:cache'
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=`$PORT'
"@ | Out-File -FilePath nixpacks.toml -Encoding UTF8