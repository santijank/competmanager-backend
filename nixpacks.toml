[phases.setup]
nixPkgs = ['php82', 'php82Extensions.mbstring', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.xml', 'php82Extensions.zip', 'php82Extensions.curl', 'php82Extensions.gd', 'php82Extensions.bcmath', 'php82Extensions.intl']

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction'
]

[phases.deploy]
cmds = []

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=8000'